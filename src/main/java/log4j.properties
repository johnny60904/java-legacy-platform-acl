# ==============================================================================
# 🚫 LEGACY LOGGING ECOSYSTEM CONFIGURATION WARNING & SECURITY DEPRECATION NOTICE
# ==============================================================================
# This proprietary properties file is tied to the historical legacy logging framework
# (Log4j/Log4j2), which is tightly coupled across 100+ legacy core system types.
#
# CRITICAL PAIN POINTS OF THE LEGACY ECOSYSTEM:
# 1. Thread Blockage Risk: Standard legacy append patterns perform synchronous disk I/O,
#    posing a severe latency threat to the primary execution loops during peak volumes.
# 2. Fragile Security Topology: Unmanaged legacy logging properties may inherently harbor
#    severe injection vulnerabilities (e.g., historical Log4Shell vector dynamics).
#
# 🛡️ ACL INTERCEPTION STRATEGY:
# To maintain complete architectural boundaries and non-blocking performance, the modern
# runtime entirely quarantines this file. We have deployed an asynchronous, thread-isolated,
# and rate-limited diagnostic logger framework via:
# -> com.dxlan.acl.features.infrastructure.log.AclLogger
